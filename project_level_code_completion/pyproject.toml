[tool.poetry]
name = "lca"
version = "0.2.0"
description = "Modernized Long Code Arena project-level code completion baseline"
package-mode = false
authors = [
    "Egor Bogomolov <egor.bogomolov@jetbrains.com>",
    "Maria Tigina <maria.tigina@jetbrains.com>"
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/JetBrains-Research/lca-baselines"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core ML stack
torch = "2.14.0"
torchvision = "0.29.0"
transformers = "5.17.0"
accelerate = "*"
datasets = "*"
huggingface-hub = "*"
bitsandbytes = "*"
safetensors = "*"

# Training / evaluation
pytorch-lightning = "*"
evaluate = "*"
optimum = "*"
wandb = "*"

# Config
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"

# Scientific stack
numpy = "*"
scipy = "*"
pandas = "*"
scikit-learn = "*"
matplotlib = "*"
seaborn = "*"

# NLP / code utilities
nltk = "*"
gensim = "*"
tiktoken = "*"
einops = "*"
opt-einsum = "*"
codegen-metrics = "^0.2.0"
thefuzz = "*"
jsonlines = "*"
colorama = "*"

# Repo / network utilities
pydriller = "*"
pyyaml = "*"
requests = "*"
aiohttp = "*"
tenacity = "*"

# Runtime / optimization
onnxruntime = "*"
pykeops = "*"

# Modern Tree-sitter
tree-sitter = "*"
tree-sitter-python = "*"

# Dev tools
black = {extras = ["jupyter"], version = "*"}
isort = "*"
mypy = "*"
jupyter = "*"

lxml-stubs = "*"
pandas-stubs = "*"
types-pyyaml = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
line_length = 120
py_version = 311
profile = "black"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true
