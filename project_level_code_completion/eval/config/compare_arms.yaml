defaults:
  - params: starcoderbase1b
  - composers_config: python_standard
  - dataset: small
  - _self_

language: 'python'
artifacts_dir: "data/code_generation/artifacts/"
seed: 42

# zero | rag | any key of COMPOSERS except none (e.g. path_distance, imports_first)
arm: rag
# Output goes to <artifacts_dir>/<language>/<model>/<dataset>/arms/<arm_name>; arm_name defaults to arm.
arm_name: null
# Evenly spaced datapoints to evaluate; null evaluates the whole dataset. Only valid with split=all.
limit_datapoints: null
# all | dev | heldout. dev = dev_size evenly spaced datapoints (indices i*n//dev_size) plus dev_extra more evenly spaced
# among the rest; heldout = all the others. With the defaults on small_context: 48 dev, 96 heldout, and the 20 datapoints
# used in the early pilot stay inside dev. Tune on dev, report once on heldout.
split: all
dev_size: 20
dev_extra: 28
# all | targeted. targeted evaluates only the lines whose needed names are defined in other files (RAG_EXPERIMENT_LOG
# section 8.13), about 6% of lines on small_context; datapoints without such lines are skipped.
lines: all
# How static composer arms are fed: provider = composer string + prefix per line (fast, no whole-dataset tokenization);
# preprocess = the original preprocessed-JSON path. Both give the generator the same text (checked in the log, V1).
static_mode: provider
# Also run the zero-context pass for non-zero arms (it only needs to run once per model).
run_zero: false
# Refuse to append to existing results unless true (generation_results.jsonl is opened in append mode).
overwrite: false

rag:
  prefix_cap: 4000
  query_lines: 10
  max_chunks: 30
  include_non_py: true
  # Cap on tokens spent on retrieved chunks; null fills whatever the budget leaves (the original behaviour).
  max_context_tokens: null
  # Optional signals, all off by default (plain BM25). See RagContextBuilder.context_for.
  proximity_weight: 0.0        # + w / (1 + path distance) on the normalised BM25 score
  import_weight: 0.0           # + w for chunks of files the completion file imports
  definitions_first: false     # first select chunks defining names used in the query lines or imported by the file
  definition_chunks: 8
  definition_tokens: 2000
  definition_imports: true
  order: best_last             # best_last | best_first
  continuation_lines: 0        # append this many lines that follow each retrieved chunk in its file
  chunking: structure          # structure | fine (overlapping windows over every file)
  fine_window: 10
  fine_stride: 5
  retriever: bm25              # bm25 | dense | hybrid (reciprocal-rank fusion of both)
  embedder: null               # Hugging Face model name; needed for dense and hybrid
  pooling: cls                 # cls | mean (how the embedder pools token vectors)
  embedding_cache: ~/lca_artifacts/embeddings
