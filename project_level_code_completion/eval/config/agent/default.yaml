# The planner agent of arm=agent (RAG_EXPERIMENT_LOG sections 8.80-8.82): a local instruction-tuned model that starts from
# RAG's own context and may add repository code, drop chunks or change nothing; CodeLlama still writes the line.
# Run it with the RAG settings the comparison uses: `arm=agent rag=F rag.prefix_cap=15900 context_cap=<N>`.
planner_model: Qwen/Qwen2.5-Coder-7B-Instruct   # or codellama/CodeLlama-7b-Instruct-hf; chosen on valid-action rate (section 8.80)
planner_dtype: float16                          # float16 | 8bit | 4bit (quantized needs bitsandbytes)
planner_max_new_tokens: 200
planner_prefix_tokens: 1500                     # the planner sees the last this many tokens of the prefix
max_listed_files: 100                           # repository files listed to the planner, nearest first
limits:                                         # agent.tools.Limits
  tool_calls: 5
  search_results: 5
  read_lines: 80
  tool_output_tokens: 1200
  seed_chunk_tokens: 300
  definition_lines: 25
  query_characters: 300
  max_items: 8
  invalid_actions: 2
