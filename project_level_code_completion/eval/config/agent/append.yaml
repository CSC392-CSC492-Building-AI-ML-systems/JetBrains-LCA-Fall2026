# Planner agent v2 (RAG_EXPERIMENT_LOG section 8.85): the planner can only ADD repository code to RAG's context. Nothing
# in RAG's ranking is removed; additions go last (lowest priority) and, if there is no room, replace at most max_evict of
# the lowest-ranked default chunks. Run: `arm=agent agent=append rag=F rag.prefix_cap=15900 context_cap=<N>`.
planner_model: Qwen/Qwen2.5-Coder-7B-Instruct
planner_dtype: 8bit
planner_max_new_tokens: 200
planner_prefix_tokens: 1500
max_listed_files: 100
limits:
  tool_calls: 5
  search_results: 5
  read_lines: 80
  tool_output_tokens: 1200
  seed_chunk_tokens: 300
  definition_lines: 25
  query_characters: 300
  max_items: 8
  invalid_actions: 2
  edit_mode: append
  max_add: 2
  max_evict: 2
