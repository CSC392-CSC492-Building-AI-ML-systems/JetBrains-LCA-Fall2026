# Planner agent v3 (RAG_EXPERIMENT_LOG section 8.93, pre-registered before any run): Qwen2.5-Coder-32B-Instruct planner,
# hybrid (BM25 + dense) search, find_usages and file_outline tools, hypothesis-guided prompt with a do-no-harm gate, and the
# "swap" edit: at most 2 additions after RAG's ranking, the planner may name at most 2 default chunks to give up (only
# together with an addition). Run: `arm=agent agent=v3 rag=F rag.prefix_cap=15900 context_cap=1753`.
# The planner does not fit next to CodeLlama-7B on a 32 GB card: use a box with >= 48 GB (80 GB recommended).
planner_model: Qwen/Qwen2.5-Coder-32B-Instruct
planner_dtype: 4bit
planner_max_new_tokens: 400
planner_prefix_tokens: 3000
max_listed_files: 100
search_embedder: Alibaba-NLP/gte-modernbert-base   # the dense model of the RAG experiments (8.18)
search_pooling: cls
search_cache: ~/lca_embedding_cache
limits:
  tool_calls: 8
  search_results: 8
  read_lines: 80
  tool_output_tokens: 1200
  seed_chunk_tokens: 300
  definition_lines: 25
  query_characters: 300
  max_items: 8
  invalid_actions: 2
  edit_mode: swap
  max_add: 2
  max_evict: 2
  search_mode: hybrid
  dense_candidates: 50
  usage_results: 5
  usage_context: 2
  outline_symbols: 80
  dedupe_searches: true
